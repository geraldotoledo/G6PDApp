<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="30%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#ef4444" flood-opacity="0.45"/>
    </filter>
    <filter id="heartShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#7f1d1d" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Fundo escuro -->
  <rect width="512" height="512" rx="118" fill="url(#bg)"/>

  <!-- Escudo Protetor Magnífico -->
  <path d="M 256 42 L 430 98 C 430 282, 256 428, 256 472 C 256 428, 82 282, 82 98 Z" fill="url(#shield)" filter="url(#glow)"/>
  <path d="M 256 58 L 414 108 C 414 272, 256 410, 256 452 C 256 410, 98 272, 98 108 Z" fill="none" stroke="#ffffff" stroke-width="5" stroke-opacity="0.25"/>

  <!-- Coração Branco 100% contido DENTRO do escudo -->
  <path d="M 256 172 C 266 138, 292 112, 326 112 C 362 112, 386 142, 386 182 C 386 244, 318 296, 256 352 C 194 296, 126 244, 126 182 C 126 142, 150 112, 186 112 C 220 112, 246 138, 256 172 Z" fill="#ffffff" filter="url(#heartShadow)"/>

  <!-- G6PD (Destaque Principal) -->
  <text x="256" y="220" 
        font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
        font-size="36" 
        font-weight="900" 
        fill="#dc2626" 
        text-anchor="middle" 
        letter-spacing="2px">G6PD</text>

  <!-- LHPT (Homenagem Discreta e Elegante) -->
  <text x="256" y="252" 
        font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
        font-size="18" 
        font-weight="700" 
        fill="#ef4444" 
        opacity="0.85" 
        text-anchor="middle" 
        letter-spacing="4px">LHPT</text>
</svg>