<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="35%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#ef4444" flood-opacity="0.4"/>
    </filter>
    <filter id="heartShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#7f1d1d" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Fundo escuro arredondado PWA -->
  <rect width="512" height="512" rx="118" fill="url(#bgGradient)"/>

  <!-- Escudo Protetor Ampliado -->
  <path d="M 256 46 
           L 426 102 
           C 426 280, 256 422, 256 466 
           C 256 422, 86 280, 86 102 
           Z" 
        fill="url(#shieldGradient)" 
        filter="url(#glow)"
  />

  <!-- Borda interna suave de brilho do escudo -->
  <path d="M 256 62 
           L 410 112 
           C 410 270, 256 404, 256 446 
           C 256 404, 102 270, 102 112 
           Z" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="5" 
        stroke-opacity="0.25"
  />

  <!-- Coração Branco Centralizado -->
  <path d="M 256 344
           C 256 344, 152 264, 152 188
           C 152 144, 184 112, 224 112
           C 246 112, 256 128, 256 128
           C 256 128, 266 112, 288 112
           C 328 112, 360 144, 360 188
           C 360 264, 256 344, 256 344 Z"
        fill="#ffffff"
        filter="url(#heartShadow)"
  />

  <!-- Sigla G6PD na base do escudo -->
  <text x="256" y="416" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="28" 
        font-weight="900" 
        fill="#ffffff" 
        text-anchor="middle" 
        letter-spacing="3" 
        opacity="0.95">G6PD</text>
</svg>
