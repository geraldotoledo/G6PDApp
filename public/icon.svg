<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="30%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <filter id="shieldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#ef4444" flood-opacity="0.45"/>
    </filter>
    <filter id="heartShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Fundo escuro arredondado PWA -->
  <rect width="512" height="512" rx="118" fill="url(#bgGradient)"/>

  <!-- Escudo Protetor Ampliado -->
  <path d="M 256 42 
           L 430 98 
           C 430 282, 256 428, 256 472 
           C 256 428, 82 282, 82 98 
           Z" 
        fill="url(#shieldGradient)" 
        filter="url(#shieldGlow)"
  />

  <!-- Borda interna suave de brilho do escudo -->
  <path d="M 256 58 
           L 414 108 
           C 414 272, 256 410, 256 452 
           C 256 410, 98 272, 98 108 
           Z" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="5" 
        stroke-opacity="0.25"
  />

  <!-- Coração Branco clássico (❤️) com fenda profunda e base mais afilada -->
  <path d="M 256 168
           C 270 120, 305 88, 350 88
           C 400 88, 436 128, 436 182
           C 436 264, 340 326, 256 388
           C 172 326, 76 264, 76 182
           C 76 128, 112 88, 162 88
           C 207 88, 242 120, 256 168
           Z" 
        fill="#ffffff" 
        filter="url(#heartShadow)"
  />

  <!-- Texto G6PD care em vermelho no centro do coração -->
  <text x="256" y="222" 
        font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
        font-size="44" 
        font-weight="900" 
        fill="#dc2626" 
        text-anchor="middle" 
        letter-spacing="2">G6PD</text>

  <text x="256" y="262" 
        font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
        font-size="28" 
        font-weight="800" 
        fill="#ef4444" 
        text-anchor="middle" 
        letter-spacing="4">care</text>
</svg>
